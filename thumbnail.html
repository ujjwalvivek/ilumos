<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>iLumos | Thumbnail</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
            }
            html,
            body {
                width: 100%;
                height: 100%;
            }
            body {
                display: grid;
                place-items: center;
                min-height: 100vh;
                color: #171411;
                background: #f7f0e4;
                background-image:
                    radial-gradient(
                        1000px 560px at 50% 118%,
                        rgba(255, 97, 0, 0.1),
                        transparent 60%
                    ),
                    radial-gradient(
                        760px 440px at 50% -12%,
                        rgba(169, 150, 126, 0.35),
                        transparent 62%
                    );
                border-top: 6px solid #101010;
                border-bottom: 6px solid #101010;
                font-family: "Manrope", "Segoe UI", Arial, sans-serif;
                overflow: hidden;
            }
            .wrap {
                text-align: center;
                padding: 24px;
            }
            .sigil {
                width: 96px;
                height: 96px;
                margin: 0 auto 28px;
            }
            .sigil svg {
                display: block;
                width: 100%;
                height: 100%;
            }
            .kicker {
                margin-bottom: 18px;
                color: #9f3d06;
                font-family: Consolas, monospace;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.32em;
                text-transform: uppercase;
            }
            h1 {
                color: #171411;
                font-size: clamp(72px, 14vw, 168px);
                font-weight: 800;
                letter-spacing: -0.05em;
                line-height: 1;
            }
            h1 em {
                font-style: normal;
                color: #ff6100;
            }
            .sub {
                margin-top: 20px;
                color: #776c61;
                font-size: clamp(15px, 2.4vw, 22px);
                letter-spacing: 0.06em;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="sigil" aria-hidden="true">
                <svg viewBox="0 0 64 64">
                    <rect width="64" height="64" rx="14" fill="#101010" />
                    <rect
                        x="12"
                        y="32"
                        width="10"
                        height="18"
                        rx="5"
                        fill="#fffaf1"
                    />
                    <rect
                        x="27"
                        y="20"
                        width="10"
                        height="30"
                        rx="5"
                        fill="#ffd200"
                    />
                    <rect
                        x="42"
                        y="26"
                        width="10"
                        height="24"
                        rx="5"
                        fill="#ff6100"
                    />
                </svg>
            </div>
            <p class="kicker">Evidence Workbench</p>
            <h1>iLumos<em>.</em></h1>
            <p class="sub">Claim chart workspace</p>
        </div>
    </body>
</html>
